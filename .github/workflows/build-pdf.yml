name: build pdf

on:
  workflow_dispatch:
  push:
    tags:
    - 'v*'

jobs:
  build:
    name: build pdf and upload release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 依存パッケージのインストール
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Puppeteer用Chromeのインストール
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      # 日本語フォントのインストール（Web フォントが読めない場合の保険。
      # これが無いと ubuntu には日本語フォントが無く PDF が豆腐になる）
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      # PDFビルド（details/summary の除去は generate-pdf.js 内で実施）
      - name: build pdf
        run: npm run build:pdf
      
      # 生成されたPDFの確認
      - name: Check generated PDF
        run: |
          ls -la docs/
          file docs/README.pdf
      
      - name: create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./docs/README.pdf
          asset_name: resume.pdf
          asset_content_type: application/pdf
