name: lint text

on: [push, pull_request]

jobs:
  build:
    name: lint text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: lint text
        run: pnpm lint
      - name: Install Chrome for Puppeteer
        run: pnpm exec puppeteer browsers install chrome
      - name: Install PDF tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-noto-cjk
      - name: Build PDF
        run: pnpm run build:pdf
      - name: Check PDF section pagination
        run: |
          pages=$(pdfinfo docs/README.pdf | awk '/^Pages:/ {print $2}')
          found=0
          for page in $(seq 1 "$pages"); do
            text=$(pdftotext -f "$page" -l "$page" docs/README.pdf -)
            # ページ番号（n/N）だけのページは白紙として扱う
            if [ -z "$(printf '%s\n' "$text" | grep -v '^[[:space:]]*$' | grep -vE '^[[:space:]]*[0-9]+/[0-9]+[[:space:]]*$')" ]; then
              echo "${page}ページ目が白紙です"
              exit 1
            fi
            if printf '%s\n' "$text" | grep -q '職務経歴詳細'; then
              first=$(printf '%s\n' "$text" | grep -v '^[[:space:]]*$' | head -n 1)
              if [ "$page" -eq 1 ] || [ "$first" != '職務経歴詳細' ]; then
                echo "職務経歴詳細が新しいページの先頭から始まっていません（${page}ページ目）"
                exit 1
              fi
              found=1
            fi
          done
          [ "$found" -eq 1 ]
